name: Butterfly
options:
  bundleIdPrefix: com.armandas
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: NLHT9F6F5X
targets:
  Butterfly:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources/Butterfly
      - path: Resources/MediaRemoteAdapter
        type: folder
        buildPhase: resources
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Art
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Butterfly
        CFBundleDisplayName: Butterfly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Updates: scripts/release.sh publishes to github.com/armandokun/butterfly
        SUFeedURL: https://github.com/armandokun/butterfly/releases/latest/download/appcast.xml
        SUPublicEDKey: USw1KgVHkB/jXNnMT/bvnUtfRp9Ouda3GTyoCHjs+Po=
        SUEnableAutomaticChecks: true
        LSUIElement: true
        NSMicrophoneUsageDescription: Butterfly listens while you hold Option so it can understand your command.
        NSSpeechRecognitionUsageDescription: Butterfly transcribes your voice on-device to understand your command.
        NSAppleEventsUsageDescription: Butterfly opens websites in new browser windows so it can place them side by side.
        NSBluetoothAlwaysUsageDescription: Butterfly connects your Bluetooth devices by voice and shows their battery in the notch.
        NSLocationUsageDescription: macOS only shares the Wi-Fi network name with apps that have Location access. Butterfly uses it to show which network you joined.
        NSLocationWhenInUseUsageDescription: macOS only shares the Wi-Fi network name with apps that have Location access. Butterfly uses it to show which network you joined.
        NSCalendarsFullAccessUsageDescription: Butterfly adds events and reads your agenda when you ask by voice.
        NSRemindersFullAccessUsageDescription: Butterfly creates reminders when you ask by voice.
    entitlements:
      path: Resources/Butterfly.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.armandas.butterfly
        PRODUCT_NAME: Butterfly
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
