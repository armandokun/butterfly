name: CTRL
options:
  bundleIdPrefix: com.armandas
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: NLHT9F6F5X
targets:
  CTRL:
    type: application
    platform: macOS
    sources:
      - path: Sources/CTRL
      - path: Resources/MediaRemoteAdapter
        type: folder
        buildPhase: resources
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Art
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: CTRL
        CFBundleDisplayName: CTRL
        LSUIElement: true
        NSMicrophoneUsageDescription: CTRL listens while you hold Option so it can understand your command.
        NSSpeechRecognitionUsageDescription: CTRL transcribes your voice on-device to understand your command.
        NSAppleEventsUsageDescription: CTRL opens websites in new browser windows so it can place them side by side.
        NSBluetoothAlwaysUsageDescription: CTRL connects your Bluetooth devices by voice and shows their battery in the notch.
        NSLocationUsageDescription: macOS only shares the Wi-Fi network name with apps that have Location access. CTRL uses it to show which network you joined.
        NSLocationWhenInUseUsageDescription: macOS only shares the Wi-Fi network name with apps that have Location access. CTRL uses it to show which network you joined.
        NSCalendarsFullAccessUsageDescription: CTRL adds events and reads your agenda when you ask by voice.
        NSRemindersFullAccessUsageDescription: CTRL creates reminders when you ask by voice.
    entitlements:
      path: Resources/CTRL.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.armandas.ctrl
        PRODUCT_NAME: CTRL
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
